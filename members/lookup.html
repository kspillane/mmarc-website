---
layout: default
title: Callsign Lookup
permalink: /lookup/
---

<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8" x-data="callsignLookup()">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">Amateur Radio Callsign Lookup</h1>
        <p class="mt-2 text-gray-600 dark:text-gray-400">Search the FCC database for license and operator information.</p>
    </div>

    <!-- Search Box -->
    <div class="bg-white dark:bg-gray-800 shadow rounded-2xl p-6 border border-gray-200 dark:border-gray-700 mb-8">
        <form @submit.prevent="search" class="flex flex-col sm:flex-row gap-4">
            <div class="flex-grow">
                <label for="callsign" class="sr-only">Callsign</label>
                <input type="text" id="callsign" x-model="callsign" placeholder="Enter Callsign (e.g. W1AW)"
                    class="w-full uppercase px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm focus:ring-brand-800 focus:border-brand-800 dark:bg-gray-700 dark:text-white text-lg font-medium"
                    required>
            </div>
            <button type="submit" :disabled="loading"
                class="inline-flex justify-center items-center px-6 py-3 border border-transparent text-lg font-medium rounded-xl shadow-sm text-white bg-brand-800 hover:bg-brand-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-800 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg x-show="!loading" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <svg x-show="loading" class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span x-text="loading ? 'Searching...' : 'Search'"></span>
            </button>
        </form>
    </div>

    <!-- Error State -->
    <div x-show="error" x-cloak class="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 p-4 rounded-r-lg mb-8" x-transition>
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm text-red-700 dark:text-red-400" x-text="error"></p>
            </div>
        </div>
    </div>

    <!-- Results State -->
    <div x-show="result" x-cloak class="bg-white dark:bg-gray-800 shadow rounded-2xl border-t-4 border-brand-800 overflow-hidden" x-transition>
        <div class="px-6 py-5 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
            <h3 class="text-2xl font-bold text-gray-900 dark:text-white" x-text="result?.current?.callsign || callsign.toUpperCase()"></h3>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold tracking-wide"
                :class="result?.status === 'VALID' ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'"
                x-text="result?.status">
            </span>
        </div>
        
        <div class="px-6 py-6" x-show="result?.status === 'VALID'">
            <dl class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-2">
                <!-- Name -->
                <div class="sm:col-span-2">
                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Name</dt>
                    <dd class="mt-1 text-lg font-semibold text-gray-900 dark:text-white" x-text="result?.name || 'N/A'"></dd>
                </div>

                <!-- Location -->
                <div class="sm:col-span-2">
                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Address / QTH</dt>
                    <dd class="mt-1 text-base text-gray-900 dark:text-white">
                        <div x-text="result?.address?.line1"></div>
                        <div x-text="result?.address?.line2"></div>
                    </dd>
                </div>

                <!-- License Class -->
                <div class="sm:col-span-1">
                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">License Class</dt>
                    <dd class="mt-1 text-base text-gray-900 dark:text-white font-medium" x-text="result?.current?.operClass || 'N/A'"></dd>
                </div>
                
                <!-- Type -->
                <div class="sm:col-span-1">
                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">License Type</dt>
                    <dd class="mt-1 text-base text-gray-900 dark:text-white capitalize" x-text="(result?.type || 'N/A').toLowerCase()"></dd>
                </div>

                <!-- Grant Date -->
                <div class="sm:col-span-1">
                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Grant Date</dt>
                    <dd class="mt-1 text-base text-gray-900 dark:text-white" x-text="formatDate(result?.otherInfo?.grantDate)"></dd>
                </div>

                <!-- Expiry Date -->
                <div class="sm:col-span-1">
                    <dt class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Expiry Date</dt>
                    <dd class="mt-1 text-base text-gray-900 dark:text-white" x-text="formatDate(result?.otherInfo?.expiryDate)"></dd>
                </div>
            </dl>
            
            <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
                <a :href="result?.otherInfo?.ulsUrl || '#'" target="_blank" x-show="result?.otherInfo?.ulsUrl"
                    class="inline-flex items-center text-brand-800 dark:text-brand-400 hover:text-brand-900 dark:hover:text-brand-300 font-medium">
                    View in FCC ULS Database
                    <svg class="ml-1 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('callsignLookup', () => ({
            callsign: '',
            loading: false,
            result: null,
            error: null,

            async search() {
                const call = this.callsign.trim().toUpperCase();
                if (!call) return;

                this.loading = true;
                this.error = null;
                this.result = null;

                try {
                    const response = await fetch(`https://callook.info/${call}/json`);
                    
                    if (!response.ok) {
                        throw new Error('Failed to fetch data from the server.');
                    }
                    
                    const data = await response.json();
                    
                    if (data.status === 'INVALID') {
                        this.error = `Callsign ${call} was not found or is invalid.`;
                    } else {
                        this.result = data;
                    }
                } catch (e) {
                    console.error('API Error:', e);
                    this.error = "An error occurred while connecting to the lookup service. Please try again later.";
                } finally {
                    this.loading = false;
                }
            },
            
            formatDate(dateString) {
                if (!dateString) return 'N/A';
                return dateString; // callook.info returns dates formatted as MM/DD/YYYY
            }
        }));
    });
</script>
