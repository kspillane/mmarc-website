<div class="max-w-4xl mx-auto py-8 px-4" x-data="repeaterApp()">
  <!-- Warning banner -->
  <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-800 p-4 mb-6 rounded shadow-sm dark:bg-yellow-900/30 dark:border-yellow-600 dark:text-yellow-200" role="alert">
    <div class="flex items-center">
      <svg class="h-6 w-6 text-yellow-600 dark:text-yellow-400 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <div>
        <p class="font-bold">Experimental Feature</p>
        <p class="text-sm">This Repeater Listen Live app is currently a work in progress and may experience connectivity issues or bugs.</p>
      </div>
    </div>
  </div>

  <h1 class="text-3xl font-bold mb-6 text-brand-800 dark:text-white">K0ETY Repeater Listen Live</h1>

  <!-- Stream Player Card -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-200 dark:border-gray-700">
    <!-- Status & Time -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center space-x-3">
        <span class="relative flex h-4 w-4">
          <span x-show="status === 'up'" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-4 w-4" 
                :class="{
                  'bg-green-500': status === 'up', 
                  'bg-red-500': status === 'down', 
                  'bg-yellow-500': status === 'connecting' || status === 'buffering'
                }"></span>
        </span>
        <span class="font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wide text-sm" x-text="statusText"></span>
      </div>
      <div class="flex flex-col items-end">
        <span class="text-xs text-gray-500 dark:text-gray-400 uppercase font-semibold">Time Played</span>
        <div class="text-3xl font-mono text-brand-800 dark:text-brand-400" x-text="formattedTime">00:00</div>
      </div>
    </div>

    <!-- Audio Element (hidden) -->
    <audio x-ref="audioPlayer" preload="none"></audio>

    <!-- Controls -->
    <div class="flex flex-col sm:flex-row items-center justify-between space-y-6 sm:space-y-0 mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
      <div class="flex space-x-3 w-full sm:w-auto">
        <button @click="playStream" :disabled="isPlaying || status === 'connecting'" class="flex-1 sm:flex-none justify-center bg-brand-800 hover:bg-brand-900 text-white font-bold py-3 px-6 rounded shadow disabled:opacity-50 disabled:cursor-not-allowed transition duration-150 flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          Play
        </button>
        <button @click="pauseStream" :disabled="!isPlaying" class="flex-1 sm:flex-none justify-center bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded shadow disabled:opacity-50 disabled:cursor-not-allowed transition duration-150 flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          Pause
        </button>
        <button @click="stopStream" :disabled="status === 'down'" class="flex-1 sm:flex-none justify-center bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded shadow disabled:opacity-50 disabled:cursor-not-allowed transition duration-150 flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" /></svg>
          Stop
        </button>
      </div>

      <!-- Volume -->
      <div class="flex items-center space-x-3 w-full sm:w-auto bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg border border-gray-200 dark:border-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500 dark:text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
        <input type="range" min="0" max="100" x-model="volume" @input="updateVolume" class="w-full sm:w-32 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer dark:bg-gray-600 accent-brand-800">
        <span class="text-sm font-medium text-gray-600 dark:text-gray-300 w-8 text-right" x-text="volume + '%'"></span>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('repeaterApp', () => ({
    streamUrl: 'http://sdr.kspillane.net:8000/live_sdr',
    status: 'down', // 'down', 'connecting', 'up', 'buffering'
    isPlaying: false,
    volume: 100,
    timePlayed: 0,
    timerInterval: null,
    retryInterval: null,
    retryDelay: 5000,
    
    init() {
      const audio = this.$refs.audioPlayer;
      audio.volume = this.volume / 100;
      
      audio.addEventListener('playing', () => {
        this.status = 'up';
        this.isPlaying = true;
        this.startTimer();
        this.clearRetry();
      });
      
      audio.addEventListener('waiting', () => {
        this.status = 'buffering';
      });
      
      audio.addEventListener('pause', () => {
        // Only set to down if it was actively playing, to handle buffering states correctly
        if (this.status === 'up') {
          this.isPlaying = false;
          this.stopTimer();
        }
      });
      
      audio.addEventListener('error', (e) => {
        console.error("Audio error:", e);
        this.handleStreamError();
      });

      audio.addEventListener('ended', () => {
        console.log("Audio ended unexpectedly.");
        this.handleStreamError();
      });
    },

    get statusText() {
      const texts = {
        'down': 'Offline / Stopped',
        'connecting': 'Connecting...',
        'up': 'Live',
        'buffering': 'Buffering...'
      };
      return texts[this.status] || this.status;
    },

    get formattedTime() {
      const hours = Math.floor(this.timePlayed / 3600);
      const minutes = Math.floor((this.timePlayed % 3600) / 60);
      const seconds = this.timePlayed % 60;
      
      if (hours > 0) {
        return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }
      return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    },

    playStream() {
      if (this.status === 'connecting' || this.isPlaying) return;
      
      this.status = 'connecting';
      const audio = this.$refs.audioPlayer;
      
      // Prevent browser caching the stream
      const cacheBuster = `?t=${new Date().getTime()}`;
      audio.src = this.streamUrl + cacheBuster;
      
      audio.play().catch(error => {
        console.error("Playback failed:", error);
        this.handleStreamError();
      });
    },

    pauseStream() {
      const audio = this.$refs.audioPlayer;
      audio.pause();
      this.status = 'down';
      this.isPlaying = false;
      this.stopTimer();
      this.clearRetry();
    },

    stopStream() {
      const audio = this.$refs.audioPlayer;
      audio.pause();
      audio.src = '';
      audio.load(); // Forces the browser to disconnect the previous stream completely
      this.status = 'down';
      this.isPlaying = false;
      this.timePlayed = 0;
      this.stopTimer();
      this.clearRetry();
    },

    updateVolume() {
      const audio = this.$refs.audioPlayer;
      audio.volume = this.volume / 100;
    },

    startTimer() {
      this.stopTimer();
      this.timerInterval = setInterval(() => {
        this.timePlayed++;
      }, 1000);
    },

    stopTimer() {
      if (this.timerInterval) {
        clearInterval(this.timerInterval);
        this.timerInterval = null;
      }
    },

    handleStreamError() {
      this.status = 'down';
      this.isPlaying = false;
      this.stopTimer();
      
      // Implement auto-retry
      if (!this.retryInterval) {
        this.status = 'connecting';
        this.retryInterval = setTimeout(() => {
          this.retryInterval = null;
          console.log("Retrying connection...");
          this.playStream();
        }, this.retryDelay);
      }
    },

    clearRetry() {
      if (this.retryInterval) {
        clearTimeout(this.retryInterval);
        this.retryInterval = null;
      }
    }
  }));
});
</script>
