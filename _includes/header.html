<header class="bg-white shadow-sm border-b border-gray-200" x-data="{ mobileMenuOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-24 gap-4 lg:gap-8">

            <!-- Logo Left -->
            <div class="flex-shrink-0 flex items-center">
                <img class="h-16 w-auto" src="{{ '/assets/images/mmarc.jpg' | relative_url }}" alt="MMARC Logo">
                <a href="{{ '/' | relative_url }}" class="ml-4 text-xl xl:text-2xl font-bold text-brand-800 hidden lg:block whitespace-nowrap">
                    {{ site.title | escape }}
                </a>
            </div>

            <!-- Nav Center/Right -->
            <div class="hidden md:flex flex-1 justify-end items-center space-x-3 lg:space-x-6 pl-4 lg:pl-8">
                <a href="{{ '/' | relative_url }}" class="text-center leading-tight text-gray-700 hover:text-brand-800 font-medium">Home</a>
                <a href="{{ '/about/' | relative_url }}"
                    class="text-center leading-tight text-gray-700 hover:text-brand-800 font-medium">About Us</a>
                <a href="{{ '/new-hams/' | relative_url }}"
                    class="text-center leading-tight text-gray-700 hover:text-brand-800 font-medium">Discover Radio</a>
                <a href="{{ '/resources/' | relative_url }}"
                    class="text-center leading-tight text-gray-700 hover:text-brand-800 font-medium">Resources</a>
                <a href="{{ '/blog/' | relative_url }}"
                    class="text-center leading-tight text-gray-700 hover:text-brand-800 font-medium">News</a>
                <a href="{{ '/outreach/' | relative_url }}"
                    class="text-center leading-tight text-gray-700 hover:text-brand-800 font-medium">Partner with Us</a>
                <a href="{{ '/contact/' | relative_url }}"
                    class="text-center leading-tight text-gray-700 hover:text-brand-800 font-medium">Contact Us</a>

                <!-- Dark Mode Toggle -->
                <button @click="$store.theme.toggle()" class="p-2 rounded-full hover:bg-gray-100 text-gray-600">
                    <span x-show="$store.theme.current === 'light'">🌙</span>
                    <span x-show="$store.theme.current === 'dark'">☀️</span>
                </button>
            </div>

            <!-- ARRL Logo Right -->
            <div class="hidden md:flex flex-shrink-0 items-center ml-4">
                <img class="h-16 w-auto" src="{{ '/assets/images/arrl.jpg' | relative_url }}" alt="ARRL Logo">
            </div>

            <!-- Mobile menu button -->
            <div class="md:hidden flex items-center">
                <button @click="mobileMenuOpen = !mobileMenuOpen" type="button"
                    class="text-gray-500 hover:text-gray-600 focus:outline-none focus:text-gray-600"
                    aria-label="Toggle menu">
                    <svg viewBox="0 0 24 24" class="h-6 w-6 fill-current">
                        <path fill-rule="evenodd"
                            d="M4 5h16a1 1 0 0 1 0 2H4a1 1 0 1 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div class="md:hidden" x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a href="{{ '/' | relative_url }}"
                class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Home</a>
            <a href="{{ '/about/' | relative_url }}"
                class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">About Us</a>
            <a href="{{ '/new-hams/' | relative_url }}"
                class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Discover Radio</a>
            <a href="{{ '/resources/' | relative_url }}"
                class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Resources</a>
            <a href="{{ '/blog/' | relative_url }}"
                class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">News</a>
            <a href="{{ '/outreach/' | relative_url }}"
                class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Partner with Us</a>
            <a href="{{ '/contact/' | relative_url }}"
                class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">Contact Us</a>
        </div>
    </div>
</header>
