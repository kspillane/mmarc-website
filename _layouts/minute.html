---
layout: default
---

<article class="minute-container" style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">
  <header class="minute-header" style="margin-bottom: 2rem; border-bottom: 2px solid #eee; padding-bottom: 1rem;">
    <h1 style="margin-bottom: 0.5rem; font-size: 2.5rem; font-weight: 700;">{{ page.title }}</h1>
    <p class="minute-meta text-muted" style="color: #666; font-size: 1.1rem;">
      <i class="fa fa-calendar" style="margin-right: 0.5rem;"></i>{{ page.date | date: "%B %Y" }}
    </p>
  </header>

  <div class="minute-content" style="line-height: 1.8;">
    {{ content }}
  </div>
</article>

<style>
/* Add a bit of polish to the text block output */
.minute-content pre {
  padding: 1.5rem;
  background-color: #f8f9fa;
  border-radius: 6px;
  border: 1px solid #e9ecef;
  white-space: pre-wrap;
  word-wrap: break-word;
  font-size: 0.95rem;
}
.minute-content h3 {
  margin-top: 2rem;
  margin-bottom: 1rem;
}
.minute-content a.button {
  display: inline-block;
  margin-bottom: 1.5rem;
  padding: 10px 20px;
  background-color: #0d6efd;
  color: white;
  text-decoration: none;
  border-radius: 4px;
  font-weight: bold;
  transition: background-color 0.2s;
}
.minute-content a.button:hover {
  background-color: #0b5ed7;
  color: white;
}
</style>
