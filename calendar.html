<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');

        // Restoring CORS proxy to allow browser to fetch the ICS file
        var originalUrl = 'https://groups.io/g/MMARC-JeffCity/ics/9508623/1996088380/feed.ics';
        var iCalUrl = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(originalUrl);

        var calendar = new FullCalendar.Calendar(calendarEl, {
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listWeek'
            },
            initialView: 'dayGridMonth',
            navLinks: true,      // can click day/week names to navigate views
            businessHours: true, // display business hours
            editable: false,     // read-only from iCal
            height: 'auto',
            events: {
                url: iCalUrl,
                format: 'ics'
            },
            // Spinner mapping
            loading: function(isLoading) {
                if (isLoading) {
                    calendarEl.style.opacity = '0.5';
                } else {
                    calendarEl.style.opacity = '1';
                }
            },
            eventClick: function(info) {
                // Prettify default click behavior for accessibility
                info.jsEvent.preventDefault();
                if (info.event.url) {
                    window.open(info.event.url, '_blank');
                } else {
                    var titleStr = info.event.title;
                    var dateStr = info.event.start.toLocaleString();
                    var descStr = info.event.extendedProps.description || "No further details provided.";
                    alert(`${titleStr}\n${dateStr}\n\n${descStr}`);
                }
            }
        });

        calendar.render();
    });
</script>
